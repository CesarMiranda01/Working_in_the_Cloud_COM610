version: '3.8'
services:
  frontend:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    volumes:
      - ./public:/app/public
      - ./.next:/app/.next
    restart: unless-stopped
    networks:
      - frontend-network

networks:
  frontend-network:
    driver: bridge